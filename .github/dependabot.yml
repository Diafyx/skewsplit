# Weekly dependency updates. Minor and patch updates are grouped per
# ecosystem; each major update gets its own pull request.
#
# New versions wait 7 days before Dependabot proposes them, so a bad release
# is usually yanked before it reaches us. Security updates do not wait.
#
# The commit prefixes and labels make Dependabot's pull requests pass
# pr-hygiene: `ci(deps)` with `type/ci`, `build(deps)` with `type/build`, and
# an `area/*` label on each. Dependabot adds the colon after the prefix.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "type/ci"
      - "area/ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Only uv.lock changes. The lower bounds in pyproject.toml are what the
    # py-lowest job tests, and the Python 3.9 and 3.10 ranges are capped on
    # purpose, so both are changed by hand.
    versioning-strategy: "lockfile-only"
    # These test tools have a separate range for each Python version, so
    # uv.lock holds several versions of each. Dependabot reads only the oldest
    # and pins every Python version to the newest release, which the capped
    # ranges reject, so its updates for them always fail. Update them by hand
    # with `uv lock --upgrade-package <name>`. A name-only ignore still allows
    # security updates. A test keeps this list equal to the split packages in
    # pyproject.toml.
    ignore:
      - dependency-name: "coverage"
      - dependency-name: "hypothesis"
      - dependency-name: "psycopg"
      - dependency-name: "pytest"
      - dependency-name: "pytest-benchmark"
      - dependency-name: "pytest-randomly"
    groups:
      uv:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    labels:
      - "dependencies"
      - "type/build"
      - "area/python"

  # PySpark for the benchmark, pinned by hash in bench/requirements.txt. The
  # PostgreSQL JDBC driver is pinned in the Makefile, where Dependabot cannot
  # see it.
  - package-ecosystem: "pip"
    directory: "/bench"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      bench:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "type/build"
      - "area/bench"

  # PySpark for the spark-e2e job, pinned by hash, in one folder per Spark
  # line. Each folder takes patch releases only: a new Spark line gets a new
  # folder and its own CI legs. PySpark declares the py4j range it needs, so
  # py4j is updated by hand with it.
  - package-ecosystem: "pip"
    directories:
      - "/python/tests/spark/pyspark-3.5"
      - "/python/tests/spark/pyspark-4.1"
      - "/python/tests/spark/pyspark-4.2"
      - "/python/tests/spark/pyspark-4.3"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "pyspark"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "py4j"
    groups:
      spark:
        update-types: ["patch"]
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "type/build"
      - "area/spark"
