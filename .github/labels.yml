# Every label in the repository. The labels workflow syncs this file on push
# to main and deletes labels that are not listed here.

# Type: exactly one per issue and pull request, matching the title type
- name: "type/bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type/build"
  color: "e1e4e8"
  description: "Build system, packaging or dependencies"
- name: "type/chore"
  color: "cfd3d7"
  description: "Maintenance with no code change"
- name: "type/ci"
  color: "bfc5cc"
  description: "CI, workflows and repository automation"
- name: "type/docs"
  color: "0075ca"
  description: "Documentation"
- name: "type/feature"
  color: "1d76db"
  description: "New capability"
- name: "type/perf"
  color: "6a737d"
  description: "Performance improvement"
- name: "type/refactor"
  color: "959da5"
  description: "Code change that neither fixes a bug nor adds a feature"
- name: "type/security"
  color: "b60205"
  description: "Security fix or hardening"
- name: "type/test"
  color: "d1d5da"
  description: "Tests only"

# Area: at least one; the names are also the allowed title scopes
- name: "area/bench"
  color: "c5def5"
  description: "Benchmark"
- name: "area/ci"
  color: "c5def5"
  description: "CI and repository automation"
- name: "area/cli"
  color: "c5def5"
  description: "Command-line interface"
- name: "area/core"
  color: "c5def5"
  description: "Pure planning core"
- name: "area/docs"
  color: "c5def5"
  description: "Documentation"
- name: "area/postgres"
  color: "c5def5"
  description: "PostgreSQL adapter"
- name: "area/python"
  color: "c5def5"
  description: "Python package"
- name: "area/release"
  color: "c5def5"
  description: "Release and publishing"
- name: "area/rust"
  color: "c5def5"
  description: "Rust crate"
- name: "area/spark"
  color: "c5def5"
  description: "Spark snippets and end-to-end tests"
- name: "area/spec"
  color: "c5def5"
  description: "Behaviour spec and golden fixtures"

# Size: set on issues as an estimate and on pull requests by the pr-size job
- name: "size/S"
  color: "c2e0c6"
  description: "Up to 100 changed lines"
- name: "size/M"
  color: "9be9a8"
  description: "101 to 300 changed lines"
- name: "size/L"
  color: "40c463"
  description: "301 to 700 changed lines"
- name: "size/XL"
  color: "30a14e"
  description: "701 to 1500 changed lines"
- name: "size/XXL"
  color: "216e39"
  description: "More than 1500 changed lines; needs a reason"

# Priority
- name: "priority/P0"
  color: "b60205"
  description: "Drop everything"
- name: "priority/P1"
  color: "d93f0b"
  description: "This milestone"
- name: "priority/P2"
  color: "fbca04"
  description: "Nice to have"

# Status
- name: "status/blocked"
  color: "000000"
  description: "Waiting on something outside this issue"
- name: "status/needs-decision"
  color: "d876e3"
  description: "Needs a maintainer decision before work starts"
- name: "status/triage"
  color: "ededed"
  description: "Needs labels, size and milestone"

# Release automation (release-please)
- name: "autorelease: pending"
  color: "ededed"
  description: "Release PR waiting to be merged and tagged"
- name: "autorelease: tagged"
  color: "ededed"
  description: "Release PR whose release has been tagged"

# Other
- name: "breaking-change"
  color: "b60205"
  description: "Changes public behaviour incompatibly"
- name: "ci:full"
  color: "5319e7"
  description: "Run every CI job regardless of changed paths"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "emergency-bypass"
  color: "e99695"
  description: "Explains a ruleset bypass"
- name: "flaky"
  color: "f9d0c4"
  description: "Test fails intermittently; quarantined"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
