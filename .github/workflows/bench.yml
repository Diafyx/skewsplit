name: Bench

# The Spark benchmark (bench/README.md). It is not part of ci-gate. It runs by
# hand, on pull requests that change the benchmark itself, so a change to
# bench/ comes with its own results, and each night from nightly.yml, which
# compares skewsplit's max task time with bench/baseline.json.
on:
  workflow_call:
    inputs:
      rows:
        description: Rows in the benchmark table
        type: number
        default: 15000000
      partitions:
        description: Partitions per read
        type: number
        default: 16
      runs:
        description: Runs of each method (the report shows medians)
        type: number
        default: 3
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in the benchmark table
        type: number
        default: 15000000
      partitions:
        description: Partitions per read
        type: number
        default: 16
      runs:
        description: Runs of each method (the report shows medians)
        type: number
        default: 3
  pull_request:
    paths:
      - 'bench/**'
      - '.github/workflows/bench.yml'

permissions:
  contents: read

# Its own group: called from nightly.yml, github.workflow is "Nightly", and a
# group shared with the ci.yml call there would hold one of them back. A new
# push to a pull request cancels its older run; every other run is its own.
concurrency:
  group: bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # GitHub-hosted runners accept no inbound connections, so trust
      # authentication needs no stored password; the database is thrown away
      # with the runner.
      postgres:
        image: postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      BENCH_ROWS: ${{ inputs.rows || 15000000 }}
      BENCH_PARTITIONS: ${{ inputs.partitions || 16 }}
      BENCH_RUNS: ${{ inputs.runs || 3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: bench/requirements.txt
      # The runner image ships several JDKs; Spark 4 supports 17 and 21.
      - name: Use Java 21
        run: |
          [[ -n "${JAVA_HOME_21_X64:-}" ]]
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: make bench BENCH_ROWS="$BENCH_ROWS" BENCH_PARTITIONS="$BENCH_PARTITIONS" BENCH_RUNS="$BENCH_RUNS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-results
          path: |
            reports/bench.json
            reports/bench/
            reports/bench-plans/
            reports/spark-events/
          if-no-files-found: ignore
          retention-days: 30
