name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever the changed paths
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Decides which jobs run. Pull requests select jobs by changed paths (see
  # .github/filters.yml and scripts/ci_select.py); every other event, and a
  # pull request labelled ci:full, runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the changed files; the labels step reads labels
    outputs:
      py-unit: ${{ steps.select.outputs.py-unit }}
      py-lowest: ${{ steps.select.outputs.py-lowest }}
      py-integration: ${{ steps.select.outputs.py-integration }}
      coverage: ${{ steps.select.outputs.coverage }}
      packaging: ${{ steps.select.outputs.packaging }}
      docs: ${{ steps.select.outputs.docs }}
      conformance: ${{ steps.select.outputs.conformance }}
      core-bench: ${{ steps.select.outputs.core-bench }}
      allowed-skips: ${{ steps.select.outputs.allowed-skips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml
      # Read the labels now rather than from the event payload, so adding
      # ci:full and re-running the workflow takes effect.
      - id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name]')" >> "$GITHUB_OUTPUT"
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          MATCHED_GROUPS: ${{ steps.filter.outputs.changes || '[]' }}
          LABELS: ${{ steps.labels.outputs.labels || '[]' }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
        run: |
          args=(--event "$EVENT" --groups "$MATCHED_GROUPS" --labels "$LABELS")
          if [[ "$FULL" == true ]]; then args+=(--full); fi
          python3 scripts/ci_select.py "${args[@]}"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # An empty ZIZMOR_FLAGS turns on zizmor's online audits, which use GH_TOKEN.
      - run: make lint ZIZMOR_FLAGS=
        env:
          GH_TOKEN: ${{ github.token }}

  py-unit:
    name: py-unit (${{ matrix.os }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.py-unit == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      PYTHON: ${{ matrix.python }}
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install GNU make
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress --yes
      - run: make py-unit PYTHON="$PYTHON"
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/junit_summary.py "py-unit, $RUNNER_OS, Python $PYTHON" reports/junit-py-unit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-py-unit-${{ matrix.os }}-${{ matrix.python }}
          path: reports/junit-py-unit.xml
          retention-days: 7

  py-lowest:
    name: py-lowest (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.py-lowest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.15"]
    env:
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make py-lowest PYTHON="$PYTHON"
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/junit_summary.py "py-lowest, Python $PYTHON" reports/junit-py-lowest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-py-lowest-${{ matrix.python }}
          path: reports/junit-py-lowest.xml
          retention-days: 7

  # The PostgreSQL adapter against every supported server version, each in a
  # service container pinned by digest. Python 3.9, with psycopg 3.2, runs
  # against the oldest server; the newest Python runs against all of them.
  py-integration:
    name: py-integration (PostgreSQL ${{ matrix.postgres }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.py-integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "15"
            python: "3.9"
            image: postgres:15.20@sha256:10f9e886f772e9d6484350b043bcf990ead67ae5d9988ddce265d72a299055d5
          - postgres: "15"
            python: "3.15"
            image: postgres:15.20@sha256:10f9e886f772e9d6484350b043bcf990ead67ae5d9988ddce265d72a299055d5
          - postgres: "16"
            python: "3.15"
            image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
          - postgres: "17"
            python: "3.15"
            image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
          - postgres: "18"
            python: "3.15"
            image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
          - postgres: "19"
            python: "3.15"
            image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    services:
      # GitHub-hosted runners accept no inbound connections, so trust
      # authentication needs no stored password; the database is thrown away
      # with the runner.
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHON: ${{ matrix.python }}
      POSTGRES: ${{ matrix.postgres }}
      SKEWSPLIT_PG_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The matrix names the major version; the server must be that version.
      - name: Check the server version
        run: |
          version=$(psql "$SKEWSPLIT_PG_DSN" --no-psqlrc --tuples-only --no-align --command 'SHOW server_version_num')
          echo "PostgreSQL $version"
          [[ "$((version / 10000))" == "$POSTGRES" ]]
      - run: make py-integration PYTHON="$PYTHON"
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/junit_summary.py "py-integration, PostgreSQL $POSTGRES, Python $PYTHON" reports/junit-py-integration.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-py-integration-${{ matrix.postgres }}-${{ matrix.python }}
          path: reports/junit-py-integration.xml
          retention-days: 7

  coverage:
    name: coverage
    needs: [changes, py-unit]
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: make coverage COMPARE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: reports/coverage.xml
          retention-days: 14

  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make packaging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make docs COMPARE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/junit_summary.py "docs examples" reports/junit-docs.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-docs
          path: reports/junit-docs.xml
          if-no-files-found: ignore
          retention-days: 7

  # The golden fixtures and the spec invariants, with the ci Hypothesis profile.
  conformance:
    name: conformance (python)
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make conformance
      - name: Summarise tests
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/junit_summary.py "conformance (python)" reports/junit-conformance.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-conformance
          path: reports/junit-conformance.xml
          retention-days: 7

  # Planner micro-benchmarks when the core changes. Timings on shared runners
  # vary, so this job reports in its summary and is not part of ci-gate.
  core-bench:
    name: core-bench
    needs: changes
    if: needs.changes.outputs.core-bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make bench-core
      - name: Summarise benchmarks
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/benchmark_summary.py "Planner benchmarks" reports/benchmark-core.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-core
          path: reports/benchmark-core.json
          if-no-files-found: ignore
          retention-days: 14

  # Sets exactly one size/* label and fails a size/XXL pull request whose
  # "Why is this PR large?" section is empty.
  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # adds and removes the size/* label
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Read the description now rather than from the event payload, so an
      # edited description counts when the job is re-run.
      - run: gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
      - id: size
        run: make pr-size COMPARE="origin/$BASE_REF" PR_BODY="$RUNNER_TEMP/pr-body.md"
        env:
          BASE_REF: ${{ github.base_ref }}
      # Tokens for pull requests from forks are read-only, so only label ours.
      - name: Set the size label
        if: >-
          ${{ !cancelled() && steps.size.outputs.label != ''
          && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          LABEL: ${{ steps.size.outputs.label }}
        run: |
          for old in $(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name | select(startswith("size/"))'); do
            if [[ "$old" != "$LABEL" ]]; then
              gh api --method DELETE "repos/$REPO/issues/$PR/labels/${old//\//%2F}" --silent
            fi
          done
          gh api "repos/$REPO/issues/$PR/labels" --field "labels[]=$LABEL" --silent

  # The single required check. It passes only if every job succeeded or was
  # skipped because `changes` did not select it.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, lint, py-unit, py-lowest, py-integration, coverage, packaging, docs, conformance, pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.changes.outputs.allowed-skips }}
