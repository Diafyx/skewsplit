[project]
name = "skewsplit"
version = "0.1.0"
description = "Balanced, index-friendly JDBC partition predicates for Spark, planned from the column's real distribution."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The skewsplit authors" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["spark", "jdbc", "postgresql", "partitioning", "skew", "predicates"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The PostgreSQL adapter, skewsplit.postgres. psycopg also needs libpq: install
# psycopg[binary] as well if the system has none. psycopg 3.3 needs Python 3.10.
postgres = [
  "psycopg>=3.2; python_version<'3.10'",
  "psycopg>=3.3; python_version>='3.10'",
]

[project.urls]
Repository = "https://github.com/Diafyx/skewsplit"
Issues = "https://github.com/Diafyx/skewsplit/issues"

[project.scripts]
skewsplit = "skewsplit.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# make mutation, which only nightly.yml runs, runs mutmut from this folder: it
# names mutants by their path below src/, as the tests import them. It copies
# src and the tests to mutants/, mutates the core, and runs pytest there.
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/skewsplit/core/*"]
also_copy = ["tests"]
pytest_add_cli_args = ["-p", "no:randomly"]
pytest_add_cli_args_test_selection = [
  "tests/property",
  "tests/unit/postgres",
  "tests/unit/test_api.py",
  "tests/unit/test_cli.py",
  "tests/unit/test_codecs.py",
  "tests/unit/test_conformance.py",
  "tests/unit/test_inputs.py",
  "tests/unit/test_pgarray.py",
  "tests/unit/test_plan.py",
  "tests/unit/test_planner.py",
  "tests/unit/test_sample.py",
]
